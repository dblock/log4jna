name: Log4JNA Default Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        entry:
          - { java: "8", distribution: "temurin" }
          - { java: "11", distribution: "microsoft" }
          - { java: "17", distribution: "temurin" }
          - { java: "21", distribution: "microsoft" }
          - { java: "25", distribution: "temurin" }
          - { java: "25", distribution: "microsoft" }
          - { java: "27", distribution: "temurin" }

    runs-on: "windows-2025"

    name: Java ${{ matrix.entry.java }} (${{ matrix.entry.distribution }})
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v7

      # Configuring Developer Command Prompt for Microsoft Visual C++
      - uses: ilammy/msvc-dev-cmd@v1.13.0

      # Setup JDK
      - uses: actions/setup-java@v6
        with:
          distribution: ${{ matrix.entry.distribution }}
          java-version: ${{ matrix.entry.java }}
          cache: maven

      # Default Build
      - run: mvn clean install -B

      # Run the packaged demos and fail if the Win32EventLog appender cannot be loaded or used
      - name: Run Demos
        shell: pwsh
        run: |
          function Invoke-Demo([string] $Name, [string] $Directory, [scriptblock] $Command) {
            Push-Location $Directory
            try {
              $out = & $Command 2>&1 | Out-String
              $code = $LASTEXITCODE
            } finally {
              Pop-Location
            }
            Write-Output $out
            if ($code -ne 0) { throw "$Name exited with code $code" }
            if ($out -match 'CLASS_NOT_FOUND|Unable to locate appender|An exception occurred processing Appender') { throw "$Name failed: $($Matches[0])" }
          }

          Invoke-Demo 'Demo with dependencies' log4jna-demo { java -jar (Get-Item target/log4jna-demo-*-jar-with-dependencies.jar).FullName }

          Expand-Archive log4jna-assembly/target/run-demo.zip -DestinationPath run-demo
          Invoke-Demo 'Demo assembly' run-demo { cmd /c rundemo.cmd }
