name: Log4JNA Default Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        entry:
          - { java: "8", distribution: "temurin" }
          - { java: "11", distribution: "microsoft" }
          - { java: "17", distribution: "temurin" }
          - { java: "21", distribution: "microsoft" }
          - { java: "25", distribution: "temurin" }
          - { java: "25", distribution: "microsoft" }
          - { java: "27", distribution: "temurin" }

    runs-on: "windows-2025"

    name: Java ${{ matrix.entry.java }} (${{ matrix.entry.distribution }})
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v7

      # Configuring Developer Command Prompt for Microsoft Visual C++
      - uses: ilammy/msvc-dev-cmd@v1.13.0

      # Setup JDK
      - uses: actions/setup-java@v6
        with:
          distribution: ${{ matrix.entry.distribution }}
          java-version: ${{ matrix.entry.java }}
          cache: maven

      # Default Build
      - run: mvn clean install -B
